<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniClaw · Local Agent</title>
  <style>
    :root{--bg:#f6f7fb;--panel:#fff;--line:#e7e9f0;--text:#171a24;--muted:#778096;--blue:#5567f5;--blue2:#eef0ff;--green:#22a06b;--shadow:0 16px 45px #24295012}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;height:100vh;overflow:hidden}
    .app{height:100%;display:grid;grid-template-columns:265px minmax(440px,1fr) 285px;gap:0}.sidebar,.inspector{background:var(--panel);border-color:var(--line)}
    .sidebar{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-weight:750;font-size:18px;letter-spacing:-.3px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#6778ff,#8e64dd);display:grid;place-items:center;color:white;font-weight:800;box-shadow:0 8px 18px #6576ed44}.new{margin:28px 0 20px;border:0;background:var(--blue);color:#fff;border-radius:10px;padding:12px;font-weight:650;cursor:pointer}.section{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:8px 10px}.session{padding:11px 12px;border-radius:10px;background:var(--blue2);display:flex;gap:9px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}.main{display:flex;flex-direction:column;min-width:0}.topbar{height:70px;background:#ffffffcc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;backdrop-filter:blur(10px)}.title{font-weight:700;font-size:16px}.subtitle{color:var(--muted);font-size:12px;margin-top:2px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.chat{flex:1;overflow:auto;padding:34px max(6vw,40px) 24px}.welcome{max-width:700px;margin:8vh auto 0}.welcome h1{font-size:30px;letter-spacing:-1px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0 0 28px}.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.suggestion{border:1px solid var(--line);background:white;border-radius:12px;padding:13px;text-align:left;cursor:pointer;color:var(--text)}.suggestion:hover{border-color:#aeb7ff;box-shadow:var(--shadow)}.suggestion b{display:block;font-size:13px;margin-bottom:3px}.suggestion span{font-size:12px;color:var(--muted)}.message{display:flex;gap:12px;max-width:790px;margin:0 auto 24px}.avatar{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700}.user .avatar{background:#e8eafd;color:#5462db}.assistant .avatar{background:#202638;color:white}.bubble{max-width:calc(100% - 45px);white-space:pre-wrap;word-break:break-word}.user .bubble{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:4px 13px 13px 13px}.assistant .bubble{padding:4px 0}.meta{font-size:11px;color:var(--muted);margin-top:6px}.tool-event{margin:8px 0 12px 42px;border-left:2px solid #cfd3e8;padding:7px 11px;color:var(--muted);font-size:12px;background:#fff;border-radius:0 8px 8px 0}.composer{padding:16px max(6vw,40px) 22px;background:linear-gradient(transparent,var(--bg) 24%)}.compose-box{max-width:790px;margin:auto;background:#fff;border:1px solid #dfe2eb;border-radius:15px;box-shadow:var(--shadow);padding:12px;display:flex;gap:10px;align-items:flex-end}.compose-box textarea{flex:1;border:0;resize:none;outline:0;font:inherit;min-height:44px;max-height:150px;padding:5px}.send{border:0;background:var(--blue);color:#fff;border-radius:10px;width:38px;height:38px;cursor:pointer;font-size:17px}.send:disabled{opacity:.5}.inspector{border-left:1px solid var(--line);padding:24px 19px;overflow:auto}.inspector h3{font-size:13px;margin:0 0 18px}.card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px;margin-bottom:12px}.label{font-size:11px;color:var(--muted);margin-bottom:3px}.value{font-size:12px;word-break:break-word}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#f0f1f8;color:#555d76;padding:4px 8px;border-radius:6px;font-size:11px}.empty{color:var(--muted);font-size:13px}@media(max-width:980px){.app{grid-template-columns:220px 1fr}.inspector{display:none}}@media(max-width:650px){.app{display:block}.sidebar{display:none}.chat{padding:24px 18px}.composer{padding:12px 18px 18px}.suggestions{grid-template-columns:1fr}.topbar{padding:0 18px}}
  </style>
  <link rel="stylesheet" href="/local_agent.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar"><div class="brand"><div class="logo">M</div><span>MiniClaw</span></div><button class="new" id="newBtn">＋ 新建对话</button><div class="section">最近对话</div><div id="conversationList"></div><div class="side-bottom">对话记录保存在浏览器本地<br/>工具调用由真实 CodingAssistant 执行</div></aside>
  <main class="main"><header class="topbar"><div><div class="title">Local Agent</div><div class="subtitle" id="workspace">正在连接工作区…</div></div><div class="status"><i class="dot"></i><span>已连接</span></div></header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>你好，我是 MiniClaw</h1><p>在你的本地工作区中运行真实 Agent。可以读代码、修改文件、运行测试、使用记忆和 Goal。</p><div class="suggestions"><button class="suggestion" data-prompt="先看看这个项目的目录结构，然后告诉我最重要的几个入口文件"><b>认识这个项目</b><span>扫描目录并说明架构</span></button><button class="suggestion" data-prompt="检查当前项目有没有明显的测试失败，先只读，不要修改文件"><b>检查项目状态</b><span>只读分析，不修改工作区</span></button><button class="suggestion" data-prompt="帮我找出最近一次工具调用产生的错误，并解释应该怎么处理"><b>诊断工具错误</b><span>读取 trace 和运行结果</span></button><button class="suggestion" data-prompt="记住：这是一次本地试用会话，回答要简洁一些"><b>试试记忆</b><span>写入一条项目记忆</span></button></div></div></section><form class="composer" id="form"><div class="compose-box"><textarea id="input" placeholder="给 MiniClaw 一个任务…（Enter 发送，Shift+Enter 换行）"></textarea><button class="send" id="send" type="submit">↑</button></div></form></main>
  <aside class="inspector"><h3>运行信息</h3><div class="card"><div class="label">模型</div><div class="value" id="model">读取中…</div></div><div class="card"><div class="label">工作区</div><div class="value" id="workspace2">读取中…</div></div><div class="card"><div class="label">Runtime</div><div class="value" id="runtime">读取中…</div></div><div class="card"><div class="label">审批</div><div class="value" id="approval">读取中…</div></div><div class="card"><div class="label">可用工具</div><div class="chips" id="tools"><span class="empty">读取中…</span></div></div><div class="card"><div class="label">Goal</div><div class="value" id="goal">暂无</div></div></aside>
</div>
<script src="/local_agent.js" defer></script>
</body>
</html>
