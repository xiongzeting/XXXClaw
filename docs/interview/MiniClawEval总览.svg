<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1420" viewBox="0 0 1460 1420" role="img" aria-labelledby="title desc">
<title id="title">图 2｜Eval 怎样分类、执行、判分与反馈</title><desc id="desc">先分清三个分类轴，再沿中间流程读。下面的指标服务于判定，不是把所有任务压成一个总分。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#62748c" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#23324a} .small{font-size:17px} .body{font-size:19px} .head{font-size:22px;font-weight:700} .title{font-size:32px;font-weight:700}</style>
<rect width="1460" height="1420" fill="#f5f7fb"/>
<text x="36" y="52" class="title">图 2｜Eval 怎样分类、执行、判分与反馈</text>
<text x="36" y="85" class="body" style="fill:#607089">先分清三个分类轴，再沿中间流程读。下面的指标服务于判定，不是把所有任务压成一个总分。</text>
<g data-box="true"><rect x="36" y="120" width="444" height="205" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="54" y="152" class="head">轴 A：数据用途｜什么时候用</text>
<text x="54" y="183" class="body">Regression：守住已修复问题</text>
<text x="54" y="210" class="body">Development：查看失败并改进机制</text>
<text x="54" y="237" class="body">Heldout：冻结，独立检验泛化</text>
<text x="54" y="264" class="body">Production：真实会话监测方向（规划）</text>
</g>
<g data-box="true"><rect x="508" y="120" width="444" height="205" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="526" y="152" class="head">轴 B：能力题型｜测什么</text>
<text x="526" y="183" class="body">任务交付、自然多轮对话</text>
<text x="526" y="210" class="body">工具执行、取消与错误恢复</text>
<text x="526" y="237" class="body">记忆召回、压缩恢复、跨会话复用</text>
<text x="526" y="264" class="body">指令遵循、安全边界；标签可以重叠</text>
</g>
<g data-box="true"><rect x="980" y="120" width="444" height="205" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="998" y="152" class="head">轴 C：评分维度｜怎么看</text>
<text x="998" y="183" class="body">Outcome：结果是否正确</text>
<text x="998" y="210" class="body">Process：过程是否符合要求</text>
<text x="998" y="237" class="body">Efficiency / Safety：成本与边界</text>
<text x="998" y="264" class="body">Reliability：重复执行是否稳定</text>
</g>
<path d="M258 325 L258 362" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M730 325 L730 362" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1202 325 L1202 362" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="368" width="1388" height="125" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="54" y="400" class="head">同一道题同时具有三种属性，而不是三套互斥试卷</text>
<text x="54" y="431" class="body">例：Development × 压缩恢复题 → 既检查最终文件，也检查真的发生压缩、未改禁区、消耗与重复结果。</text>
<text x="54" y="458" class="body">层级：Suite（一套题）→ Case（任务）→ Attempt（一次尝试）→ Phase（多轮输入）→ Checks（判定规则）</text>
</g>
<path d="M730 493 L730 523" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="529" width="310" height="151" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="54" y="561" class="head">① 准备与冻结</text>
<text x="54" y="592" class="body">初始文件、输入、多轮阶段</text>
<text x="54" y="619" class="body">验收规则、预算、重复次数</text>
<text x="54" y="646" class="body">先用反例校准判断器</text>
</g>
<g data-box="true"><rect x="390" y="529" width="320" height="151" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="408" y="561" class="head">② 运行真实 Agent</text>
<text x="408" y="592" class="body">独立工作区与可控会话</text>
<text x="408" y="619" class="body">模型 → 工具 → Runtime</text>
<text x="408" y="646" class="body">需要时注入取消或故障</text>
</g>
<g data-box="true"><rect x="754" y="529" width="310" height="151" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="772" y="561" class="head">③ 留下可核验材料</text>
<text x="772" y="592" class="body">最终回复、文件差异</text>
<text x="772" y="619" class="body">工具 / 召回 / 压缩 trace</text>
<text x="772" y="646" class="body">Token、费用、时延、错误</text>
</g>
<g data-box="true"><rect x="1108" y="529" width="316" height="151" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="1126" y="561" class="head">④ 独立检查与聚合</text>
<text x="1126" y="592" class="body">文件断言、命令检查</text>
<text x="1126" y="619" class="body">轨迹规则；需要时模型裁判</text>
<text x="1126" y="646" class="body">按任务、能力、维度汇总</text>
</g>
<path d="M346 604 L390 604" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M710 604 L754 604" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1064 604 L1108 604" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1265 680 L1265 715" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="724" width="1388" height="76" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="54" y="756" class="head">主要指标：既看“做对没有”，也看“代价、证据和稳定性”</text>
</g>
<g data-box="true"><rect x="36" y="826" width="444" height="174" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="54" y="858" class="head">结果与重复性</text>
<text x="54" y="889" class="body">Case / Attempt pass rate：不同分母</text>
<text x="54" y="916" class="body">pass_at_k：观察到 k 次至少成功一次</text>
<text x="54" y="943" class="body">pass_all：本次 k 次全部成功</text>
<text x="54" y="970" class="body">能力 / 维度分组，定位失败集中在哪</text>
</g>
<g data-box="true"><rect x="508" y="826" width="444" height="174" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="526" y="858" class="head">效率与运行可靠性</text>
<text x="526" y="889" class="body">输入 / 输出 / 缓存 Token、费用</text>
<text x="526" y="916" class="body">首 Token / 模型延迟 P95、总耗时</text>
<text x="526" y="943" class="body">工具耗时、调用数、失败 / 重试 / 取消</text>
<text x="526" y="970" class="body">区分 Agent 请求与记忆等辅助请求</text>
</g>
<g data-box="true"><rect x="980" y="826" width="444" height="174" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="998" y="858" class="head">记忆与安全证据</text>
<text x="998" y="889" class="body">召回注入量、压缩次数与节省 Token</text>
<text x="998" y="916" class="body">压缩后答案是否正确、原文能否恢复</text>
<text x="998" y="943" class="body">越界写入、审批、敏感路径、指令遵循</text>
<text x="998" y="970" class="body">覆盖到某能力 ≠ 已证明该能力通过</text>
</g>
<g data-box="true"><rect x="36" y="1024" width="1388" height="110" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="54" y="1056" class="head">检索专项指标要有标注和对应评测器，不能直接从相似度分数推导</text>
<text x="54" y="1087" class="body">Precision@K / Recall@K：命中多少正确证据；MRR / nDCG：正确证据排得怎样。</text>
<text x="54" y="1114" class="body">通用 runner 不自动产出全部这些指标；原生 Eval、公开 benchmark、离线测试也不能混用通过率。</text>
</g>
<path d="M730 1134 L730 1165" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="1173" width="1388" height="185" rx="14" fill="#fff3e4" stroke="#e0b274" stroke-width="1.4"/>
<text x="54" y="1205" class="head">⑤ 与基线比较 → 按失败类型修机制 → 同口径复测</text>
<text x="54" y="1236" class="body">先检查判断器、证据缺失、配置错误，再区分模型决策、工具契约、记忆、运行时或网络故障。</text>
<text x="54" y="1263" class="body">在开发分布中修复共性问题，把边界案例留作回归；保留集用于独立检查，不逐题调 prompt。</text>
<text x="54" y="1290" class="body">通过数必须同时说明：样本数、重复次数、模型 / 环境、是否真实执行、哪些失败仍未解决。</text>
<text x="54" y="1317" class="body">少量重复全通过不代表未来永不失败；单元测试数也不等于真实模型任务数。</text>
</g></svg>