<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1770" viewBox="0 0 1460 1770" role="img" aria-labelledby="title desc">
<title id="title">图 1｜一个任务怎样经历召回、执行、压缩与再次召回</title><desc id="desc">教学轨迹：修复金额计算，保持 CSV 字段兼容。沿编号向下读；虚线表示分支或循环。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#62748c" stroke-width="1.3"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#23324a} .small{font-size:17px} .body{font-size:19px} .head{font-size:22px;font-weight:700} .title{font-size:32px;font-weight:700}</style>
<rect width="1460" height="1770" fill="#f5f7fb"/>
<text x="36" y="52" class="title">图 1｜一个任务怎样经历召回、执行、压缩与再次召回</text>
<text x="36" y="85" class="body" style="fill:#607089">教学轨迹：修复金额计算，保持 CSV 字段兼容。沿编号向下读；虚线表示分支或循环。</text>
<g data-box="true"><rect x="36" y="110" width="675" height="140" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="54" y="142" class="head">0  会话初始化：CodingAssistant 组装组件</text>
<text x="54" y="173" class="body">按 session_id 恢复 Working Context，创建 AgentLoop</text>
<text x="54" y="200" class="body">ToolManager：6 个编程工具 + memory / skill</text>
<text x="54" y="227" class="body">再注册 goal / goal_complete，向模型暴露 JSON Schema</text>
</g>
<g data-box="true"><rect x="733" y="110" width="691" height="140" rx="14" fill="#fff3e4" stroke="#e0b274" stroke-width="1.4"/>
<text x="751" y="142" class="head">执行环境同时就绪：ToolRuntime</text>
<text x="751" y="173" class="body">direct / snapshot → 确定有效 workspace</text>
<text x="751" y="200" class="body">共享 WorkspaceGuard；配置审批、超时和命令后端</text>
<text x="751" y="227" class="body">Host / Docker 是命令后端选项，与 workspace 模式分开</text>
</g>
<path d="M360 250 L360 283" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="285" width="415" height="166" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="54" y="317" class="head">1  请求进入工作记忆</text>
<text x="54" y="348" class="body">用户：修复金额计算，保留 CSV 字段</text>
<text x="54" y="375" class="body">Working：旧上下文 + 本轮请求</text>
<text x="54" y="402" class="body">session.jsonl 持续追加消息</text>
</g>
<g data-box="true"><rect x="489" y="285" width="492" height="166" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="507" y="317" class="head">按本轮问题召回历史证据</text>
<text x="507" y="348" class="body">语义 / 情景 / 技能 / Archive 多源候选</text>
<text x="507" y="375" class="body">BM25 + 可选向量 → 融合、重排、预算筛选</text>
<text x="507" y="402" class="body">示例命中：金额约定、字段定义、相关技能</text>
</g>
<g data-box="true"><rect x="1019" y="285" width="405" height="166" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="1037" y="317" class="head">模型看到两部分上下文</text>
<text x="1037" y="348" class="body">近期对话：当前正在做什么</text>
<text x="1037" y="375" class="body">召回证据：过去有哪些相关约束</text>
<text x="1037" y="402" class="body">然后提出 read / edit / bash 等调用</text>
</g>
<path d="M451 366 L489 366" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M981 366 L1019 366" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1220 451 L1220 484" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="487" width="1388" height="443" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="54" y="519" class="head">2  工具进入受控执行边界：它是一条检查链，不是一个统一容器</text>
</g>
<g data-box="true"><rect x="58" y="540" width="300" height="95" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="76" y="572" class="head">ToolManager / Executor</text>
<text x="76" y="603" class="small">查找工具 → 准备与校验参数</text>
</g>
<g data-box="true"><rect x="390" y="540" width="350" height="95" rx="14" fill="#eaf1ff" stroke="#87a9ed" stroke-width="1.4"/>
<text x="408" y="572" class="head">项目指令检查</text>
<text x="408" y="603" class="small">按目标路径加载相关规则</text>
</g>
<g data-box="true"><rect x="772" y="540" width="350" height="95" rx="14" fill="#fff3e4" stroke="#e0b274" stroke-width="1.4"/>
<text x="790" y="572" class="head">ApprovalGate</text>
<text x="790" y="603" class="small">依据配置允许、拒绝或等待审批</text>
</g>
<g data-box="true"><rect x="1154" y="540" width="248" height="95" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="1172" y="572" class="head">检查未通过</text>
<text x="1172" y="603" class="small">返回错误，交给模型处理</text>
</g>
<path d="M358 588 L390 588" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M740 588 L772 588" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M1122 588 L1154 588" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<path d="M950 635 L950 666" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="958.0" y="643.5" class="small" style="fill:#607089">通过</text>
<g data-box="true"><rect x="58" y="672" width="608" height="146" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="76" y="704" class="head">文件工具：read / write / edit / grep / search</text>
<text x="76" y="735" class="body">WorkspaceGuard：路径映射、越界与敏感路径检查</text>
<text x="76" y="762" class="body">在宿主侧访问有效 workspace；不逐个进入 Docker</text>
<text x="76" y="789" class="body">示例：读取金额函数与 CSV 定义，再修改代码</text>
</g>
<g data-box="true"><rect x="706" y="672" width="696" height="146" rx="14" fill="#fff3e4" stroke="#e0b274" stroke-width="1.4"/>
<text x="724" y="704" class="head">命令工具：bash → ToolRuntime.run()</text>
<text x="724" y="735" class="body">Host：启动宿主进程，不具备 Docker 隔离</text>
<text x="724" y="762" class="body">Docker：挂载 workspace，执行测试，超时或取消时清理</text>
<text x="724" y="789" class="body">容器配置：网络、资源限制、只读根文件系统、敏感路径遮蔽</text>
</g>
<path d="M950 658 H360 V672" fill="none" stroke="#62748c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="60" y="858" class="body">WorkspaceGuard 限制工具的路径访问；不能逐条拦截任意 Host shell 命令内部的文件操作。</text>
<text x="60" y="894" class="body">memory / skill / goal 也走公共执行入口，但由各自存储接口执行，不沿 bash 的容器分支。</text>
<path d="M730 930 L730 960" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="965" width="675" height="168" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="54" y="997" class="head">3  ToolResult 回写，工作记忆增长</text>
<text x="54" y="1028" class="body">工具结果与调用 ID 配对 → 写入消息 → 更新页面与 trace</text>
<text x="54" y="1055" class="body">大输出先保存为制品，给模型返回引用与有限预览</text>
<text x="54" y="1082" class="body">读到新实体时可触发补充召回，例如特殊折扣规则</text>
</g>
<g data-box="true"><rect x="749" y="965" width="675" height="168" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="767" y="997" class="head">每轮结束：检查上下文水位</text>
<text x="767" y="1028" class="body">未超过阈值：继续模型 → 工具 → 结果循环</text>
<text x="767" y="1055" class="body">超过软阈值：先尝试确定性压缩</text>
<text x="767" y="1082" class="body">达到硬压缩条件：必要时调用模型摘要</text>
</g>
<path d="M1424 1020 H1443 V370 H1424" fill="none" stroke="#62748c" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="1290" y="956" class="small" style="fill:#607089">继续循环</text>
<path d="M1075 1133 L1075 1163" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="1168" width="1388" height="204" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="54" y="1200" class="head">4  压缩改变“下一轮可见上下文”，原始证据仍可恢复</text>
<text x="54" y="1231" class="body">压缩前：［旧对话 + 多轮调用与长输出 + 最近完整轮次］</text>
<text x="54" y="1258" class="body">压缩后：［Checkpoint：目标 / 约束 / 进度 / 归档引用］ + ［近期完整消息］</text>
<text x="54" y="1285" class="body">磁盘保留：追加式会话记录 + 历史归档 + 大输出制品；Archive 建索引用于后续查找</text>
<text x="54" y="1312" class="body">保留调用—结果配对；软压缩仍不足时可以延期，不强行截断协议</text>
</g>
<path d="M730 1372 L730 1402" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="1407" width="675" height="150" rx="14" fill="#e7f5ed" stroke="#8fc4a6" stroke-width="1.4"/>
<text x="54" y="1439" class="head">5  继续验证：缺少细节就定向恢复</text>
<text x="54" y="1470" class="body">例如：摘要没保留 CSV 字段顺序</text>
<text x="54" y="1497" class="body">memory.archive_search → 找归档 → read 制品正文</text>
<text x="54" y="1524" class="body">重新运行测试，依据真实结果交付或继续修复</text>
</g>
<g data-box="true"><rect x="749" y="1407" width="675" height="150" rx="14" fill="#f0eafb" stroke="#b49ada" stroke-width="1.4"/>
<text x="767" y="1439" class="head">6  任务结束，记忆进入下一次会话</text>
<text x="767" y="1470" class="body">Episodic 保存会话摘要；Semantic 只接收合格稳定信息</text>
<text x="767" y="1497" class="body">Procedural 保留技能，候选经验不直接等于已安装技能</text>
<text x="767" y="1524" class="body">下次“新增税率功能”再按问题召回，而非注入全部历史</text>
</g>
<path d="M711 1484 L749 1484" fill="none" stroke="#62748c" stroke-width="1.8" marker-end="url(#arrow)"/>
<g data-box="true"><rect x="36" y="1590" width="1388" height="138" rx="14" fill="#ffffff" stroke="#d1dbe8" stroke-width="1.4"/>
<text x="54" y="1622" class="head">读图时只记住这三句话</text>
<text x="54" y="1653" class="body">四个核心模块：Working / Semantic / Episodic / Procedural；Archive 是归档证据层。</text>
<text x="54" y="1680" class="body">召回决定“补什么历史”，压缩决定“当前保留什么”；两者不等于自动写入长期事实。</text>
<text x="54" y="1707" class="body">Trace 贯穿模型、工具、召回与压缩，为下图 Eval 提供可判定证据；短任务不一定发生压缩。</text>
</g></svg>